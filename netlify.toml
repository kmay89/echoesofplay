# Netlify configuration for Echoes of Play
# Deploy: Netlify continuous deployment from GitHub
# DNS: Cloudflare (DNS-only mode, no proxy — let Netlify handle SSL)
# Build: None. There is no build step. The source IS the product.

[build]
  publish = "/"
  command = "echo 'No build step. The source is the product.'"

# Main page
[[redirects]]
  from = "/index"
  to = "/"
  status = 200

# Policy pages serve markdown as-is (Netlify renders them)
# Users can also access raw files on GitHub

# Security headers applied to all routes
[[headers]]
  for = "/*"
  [headers.values]
    # Prevent MIME sniffing
    X-Content-Type-Options = "nosniff"
    # Prevent clickjacking
    X-Frame-Options = "DENY"
    # Referrer policy — send nothing
    Referrer-Policy = "no-referrer"
    # Permissions policy — deny everything we don't use
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()"
    # Content Security Policy — the nuclear option
    # Only allow resources from self. No external anything.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'none'"
    # Strict Transport Security
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # Cross-Origin policies
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
    Cross-Origin-Resource-Policy = "same-origin"

# Cache static assets aggressively (they never change without a deploy)
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Custom 404 (just redirect to home)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
